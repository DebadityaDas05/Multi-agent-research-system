[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",  # Line length (prompts and inline HTML/CSS can exceed standard 88 chars)
    "W291",  # Trailing whitespace
    "W292",  # No newline at end of file
    "W293",  # Blank line whitespace
    "F841",  # Unused local variable (non-fatal)
    "F401",  # Unused import (non-fatal)
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::pytest.PytestRemovedIn10Warning",
]
